<title>Archviz</title>
<style>
  :root { --bg:#070914; --panel:#11152bcc; --text:#e8ebff; --muted:#9aa3c7; --line:#2a3160; --accent:#7c8cff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,sans-serif; overflow:hidden; }
  #scene { position:fixed; inset:0; }
  .panel { position:fixed; background:var(--panel); backdrop-filter:blur(10px); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
  #top { top:12px; left:12px; max-width:min(400px, calc(100vw - 24px)); max-height:40vh; overflow:auto; }
  #top h1 { margin:0 0 6px; font-size:20px; }
  #top p { margin:0 0 8px; color:var(--muted); font-size:13px; line-height:1.5; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .chip { font-size:11px; padding:3px 8px; border-radius:99px; background:#ffffff14; border:1px solid var(--line); }
  #crumbs { top:12px; left:50%; transform:translateX(-50%); padding:8px 14px; font-size:13px; text-align:center; max-width:calc(100vw - 880px); min-width:240px; }
  #crumbs .hint { font-size:11px; color:var(--muted); margin-top:3px; }
  #legend { bottom:12px; left:12px; font-size:12px; display:flex; flex-direction:column; gap:4px; max-height:40vh; overflow:auto; }
  #legend .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; box-shadow:0 0 8px currentColor; background:currentColor; }
  #legend .ln { display:inline-block; width:22px; height:0; margin-right:6px; vertical-align:middle; border-top:2px solid #9aa3c7; }
  #legend hr { border:0; border-top:1px solid var(--line); width:100%; margin:4px 0; }
  #details { top:12px; right:12px; width:min(380px, calc(100vw - 24px)); max-height:calc(100vh - 230px); overflow:auto; display:none; }
  #details h2 { margin:0 0 4px; font-size:17px; }
  #details .path { font-family:ui-monospace,monospace; font-size:11px; color:var(--muted); word-break:break-all; }
  #details p, #details li { font-size:13px; line-height:1.55; }
  #details ul { padding-left:18px; margin:6px 0; }
  #details h3 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:14px 0 4px; }
  .analogy { border-left:3px solid var(--accent); padding-left:10px; color:#cfd5ff; font-style:italic; }
  .why-inferred { border-left:3px solid #ffd84d; padding-left:10px; color:#ffe98a; }
  .ev { font-family:ui-monospace,monospace; font-size:11px; color:var(--muted); word-break:break-all; }
  .kind { font-size:11px; color:var(--muted); }
  .badge { display:inline-block; font-size:10px; font-weight:600; padding:2px 7px; border-radius:99px; text-transform:uppercase; letter-spacing:.06em; vertical-align:middle; margin-right:4px; }
  .b-verified { background:#2ee6a62e; color:#7ff5c9; } .b-inferred { background:#ffd84d2e; color:#ffe98a; }
  .b-request { background:#ffffff22; color:#fff; } .b-response { background:#4fc3ff2e; color:#9fe0ff; }
  .b-planned { background:#9aa3c72e; color:#c9cfe8; } .b-optional { background:#5ce1e62e; color:#a5f0f2; }
  .b-internal { background:#b36bff2e; color:#d6b3ff; } .b-async { background:#ff5cf02e; color:#ff9cf6; } .b-error { background:#ff4d4d2e; color:#ff9a9a; }
  .linkbtn { background:none; border:0; padding:0; color:var(--accent); font:inherit; cursor:pointer; text-decoration:underline; text-underline-offset:2px; }
  .close { float:right; background:none; border:0; color:var(--muted); font-size:20px; cursor:pointer; }
  #flowbar { bottom:12px; right:12px; width:min(480px, calc(100vw - 24px)); max-height:42vh; overflow:auto; }
  #flowbar .controls { display:flex; gap:6px; flex-wrap:wrap; }
  select, button { font:inherit; font-size:13px; color:var(--text); background:#1b2146; border:1px solid var(--line); border-radius:8px; padding:6px 10px; cursor:pointer; }
  button:hover, select:hover { border-color:var(--accent); }
  #details button.linkbtn, #crumbs button.linkbtn { border:0; background:none; padding:0; }
  #caption { margin-top:10px; font-size:14px; line-height:1.55; min-height:44px; }
  #caption .step { color:var(--accent); font-weight:600; font-size:12px; display:block; margin-bottom:2px; }
  #caption .carries { font-size:12px; color:#cfd5ff; margin-top:4px; }
  .label { color:#fff; font-size:12px; padding:2px 7px; border-radius:6px; background:#0009; white-space:nowrap; pointer-events:none; text-shadow:0 0 6px #000; }
  .label.ghost { opacity:.55; }
  .label.dim { opacity:.2; }
  .layerTitle { font-size:13px; font-weight:700; letter-spacing:.15em; text-transform:uppercase; opacity:.55; pointer-events:none; }
  #err { position:fixed; inset:0; display:none; place-items:center; text-align:center; padding:24px; color:var(--muted); }
  @media (max-width:1100px) { #crumbs { top:auto; bottom:calc(42vh + 24px); left:12px; transform:none; max-width:calc(100vw - 24px); } }
  @media (max-width:700px) { #legend { display:none; } #top { max-height:28vh; } #crumbs .hint { display:none; } }
</style>

<script id="archviz-data" type="application/json">{"project": "AI Engineering Lab: the 7 pattern labs", "summary": "Seven LLM design patterns (RAG, fine-tuning, caching, guardrails, feedback, agent evals, observability), each built as a working, measured Python module on a shared core.", "stack": ["Python 3.10", "FastAPI", "SQLite", "numpy", "sentence-transformers (MiniLM)", "torch + transformers + peft (LoRA)", "httpx → DeepSeek / Groq"], "architecture": {"style": "Modular monolith: one FastAPI process, seven pattern modules on a shared core (tracing, providers, embeddings, SQLite), plus one subprocess job runner for training", "summary": "Each pattern lives in its own package (backend/lab/p01_rag … p07_observability) with its own router, logic and benchmark. They all lean on lab/core: one LLM client for DeepSeek and Groq, one embedder, one SQLite file, and one tracing helper. Every module wraps its work in tracing.span(...), so every request in every lab becomes a tree of spans that the observability lab (TraceLens) reads back. Two labs reuse others: SignalLoop (feedback) runs RAG questions through the Evidence Atlas pipeline, and TraceLens's demo-traffic button drives RAG, cache, guardrails and agents to create real traces.", "deployables": [{"name": "FastAPI backend (uvicorn)", "what": "Serves every lab's JSON API on 127.0.0.1:8000", "evidence": ["backend/lab/api.py:17-21", "Makefile:15-16"]}, {"name": "Training/eval subprocesses", "what": "LoRA training and model evaluation run as separate Python processes so the API stays responsive", "evidence": ["backend/lab/core/jobs.py:29-37"]}, {"name": "CLI experiment scripts", "what": "Each lab's benchmark can be run from the terminal (python -m lab.pXX...)", "evidence": ["Makefile:31-36"]}], "unknowns": ["No deployment config (Docker, cloud) in the repo: it is a local, single-user lab.", "Prefix/KV caching happens inside DeepSeek/Groq servers; the lab only reads the cached-token count they report back.", "DeepSeek pric ": "action + role + taint → allow | approval | deny", "confidence": "verified", "evidence": ["backend/lab/p04_guardrails/pipeline.py:203", "backend/lab/p04_guardrails/policy.py:51-52"]}, {"from": "guard.pipeline", "to": "guard.sqlguard", "kind": "request", "text": "Allowed SQL runs on a read-only connection with an authorizer that denies sensitive columns while the query executes.", "data": "SELECT … → rows", "confidence": "verified", "evidence": ["backend/lab/p04_guardrails/pipeline.py:146-149", "backend/lab/p04_guardrails/sqlguard.py:94-108"]}, {"from": "guard.pipeline", "to": "labdb", "kind": "async", "text": "Risky actions (outbound email, P1 tickets, exports) are queued for human approval instead of running. Friction by design.", "data": "INSERT guard_approvals (pending)", "confidence": "verified", "evidence": ["backend/lab/p04_guardrails/pipeline.py:213-219"]}, {"from": "guard.pipeline", "to": "api.app", "kind": "response", "text": "Output guardrails redact PII from the summary and defang hostile links, then return per-action decisions.", "data": "JSON {actions[status], summary, stages, trace_id}", "confidence": "verified", "evidence": ["backend/lab/p04_guardrails/pipeline.py:225-242"]}]}, {"name": "Agent mission scored on trajectory (MissionReplay)", "trigger": "User runs an agent on a scenario", "description": "A bounded tool-use loop where every tool call is a span, then the whole trajectory is scored.", "steps": [{"from": "api.app", "to": "ag.eval", "kind": "request", "text": "The route checks the scenario exists and that a provider is configured for the LLM agent.", "data": "{scenario, agent, temperature}", "confidence": "verified", "evidence": ["backend/lab/p06_agent_evals/api.py:30-35"]}, {"from": "ag.eval", "to": "ag.agents", "kind": "request", "text": "run() creates a fresh simulator and opens an agent.run root span.", "data": "scenario id", "confidence": "verified", "evidence": ["backend/lab/p06_agent_evals/agents.py:146-153"]}, {"from": "ag.agents", "to": "core.providers", "kind": "request", "text": "Each turn the model gets the conversation plus nine tool schemas. The loop ends when it calls finish, hits max_steps, or replies twice without a tool.", "data": "messages + tools → tool_calls", "confidence": "verified", "evidence": ["backend/lab/p06_agent_evals/agents.py:112-115", "backend/lab/p06_agent_evals/agents.py:127-132"]}, {"from": "ag.agents", "to": "ag.sim", "kind": "request", "text": "Each tool call is validated and executed in the simulated world, which keeps changing (casualties rise, roads close). The Recorder wraps it in a tool span.", "data": "{tool, args} → observation | error", "confidence": "verified", "evidence": ["backend/lab/p06_agent_evals/agents.py:24-31"]}, {"from": "ag.agents", "to": "core.providers", "kind": "error", "text": "If the model emits invalid JSON tool arguments, the error is recorded and sent back so it can retry; 3 in a row aborts.", "data": "MalformedToolCall", "confidence": "verified", "evidence": ["backend/lab/p06_agent_evals/agents.py:116-124"]}, {"from": "ag.eval", "to": "ag.eval", "kind": "internal", "text": "evaluate() scores the trajectory, not the final message: required-call recall, action precision, argument validity, safety violations, grounding and efficiency.", "data": "steps + final state → eval", "confidence": "verified", "evidence": ["backend/lab/p06_agent_evals/evaluate.py:38-60", "backend/lab/p06_agent_evals/evaluate.py:115-134"]}, {"from": "ag.eval", "to": "labdb", "kind": "request", "text": "The run, its trace_id and evaluation are stored so TraceLens can show the same run as a span tree.", "data": "INSERT agent_runs", "confidence": "verified", "evidence": ["backend/lab/p06_agent_evals/evaluate.py:156-159"]}]}, {"name": "Feedback → gated release (SignalLoop)", "trigger": "A user rates an answer; later a reviewer gates a new release", "description": "The flywheel: collect, curate by review, freeze an eval set, and promote only when the gate passes.", "steps": [{"from": "fb.collect", "to": "rag.pipeline", "kind": "request", "text": "Questions are answered by the RAG pipeline using the production release's config.", "data": "question + release config", "confidence": "verified", "evidence": ["backend/lab/p05_feedback/service.py:76-79"]}, {"from": "fb.collect", "to": "labdb", "kind": "request", "text": "The interaction is stored with a salted user hash, never the raw user id. Feedback text is PII-redacted.", "data": "fb_interactions, fb_feedback", "confidence": "verified", "evidence": ["backend/lab/p05_feedback/service.py:55-57", "backend/lab/p05_feedback/service.py:98-106"]}, {"from": "fb.curate", "to": "labdb", "kind": "request", "text": "A reviewer approves feedback into a dataset. Injection-like corrections and training use without consent are refused.", "data": "INSERT fb_examples", "confidence": "verified", "evidence": ["backend/lab/p05_feedback/service.py:172-181"]}, {"from": "fb.release", "to": "rag.eval", "kind": "request", "text": "The gate re-checks the frozen set's hash, then runs baseline and candidate on it.", "data": "frozen items → metrics for both", "confidence": "verified", "evidence": ["backend/lab/p05_feedback/service.py:291-299"]}, {"from": "fb.release", "to": "api.app", "kind": "error", "text": "Promotion without a passing gate raises PermissionError, which the app turns into HTTP 403.", "data": "403 forbidden", "confidence": "verified", "evidence": ["backend/lab/p05_feedback/service.py:321-322", "backend/lab/api.py:34-36"]}]}, {"name": "LoRA training job (IntentForge)", "trigger": "User clicks Train", "description": "Training runs as a separate process so the API stays responsive; the UI polls a status file.", "steps": [{"from": "api.app", "to": "core.jobs", "kind": "request", "text": "The route builds CLI args and asks the job runner to spawn training. A second concurrent run is refused with 409.", "data": "{epochs, lr, r, alpha}", "confidence": "verified", "evidence": ["backend/lab/p02_finetune/a <script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const D = JSON.parse(document.getElementById('archviz-data').textContent);
const A = D.architecture || {};
const flows = D.flows || [];
const links = D.links || [];
const PALETTE = [0x4fc3ff, 0xff9f43, 0xb36bff, 0x2ee6a6, 0xffd84d, 0xff5c8a, 0x5ce1e6, 0xa3e635, 0xff7ae0, 0x9aa3c7];
const ASYNC = 0xff5cf0;
const STEP_COLOR = { request: 0xffffff, response: 0x4fc3ff, internal: 0xd6b3ff, async: ASYNC, error: 0xff4d4d };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const hex = (c) => '#' + c.toString(16).padStart(6, '0');

const groups = new Map(D.groups.map((g, i) => [g.id, { ...g, color: g.color ? parseInt(g.color.slice(1), 16) : PALETTE[i % PALETTE.length] }]));
const byId = new Map(D.nodes.map((n) => [n.id, n]));
const children = (id) => D.nodes.filter((n) => n.parent === id);
const topOf = (id) => byId.get(id)?.parent || id;
const gid = (n) => n.group || byId.get(n.parent)?.group;
const nameOf = (id) => esc(byId.get(id)?.label || id);
const badge = (c) => c ? `<span class="badge b-${esc(c)}">${esc(c)}</span>` : '';

// ---------- header + legend ----------
document.title = `${D.project} · Archviz`;
document.getElementById('title').textContent = D.project;
document.getElementById('summary').textContent = D.summary || '';
document.getElementById('stack').innerHTML = (D.stack || []).map((s) => `<span class="chip">${esc(s)}</span>`).join('');
document.getElementById('legend').innerHTML =
  [...groups.values()].map((g) => `<div><span class="dot" style="color:${hex(g.color)}"></span>${esc(g.name)}</div>`).join('') +
  `<hr><div><span class="ln"></span>verified link</div>
   <div><span class="ln" style="border-top-style:dashed;border-color:#ffd84d"></span>inferred link</div>
   <div><span class="ln" style="border-color:${hex(ASYNC)}"></span>async (queue / event / job)</div>
   <div>◉ has parts · double-click to explore</div><div>◆ external service</div><div>wireframe = planned, not built yet</div>`;

// ---------- scene ----------
const host = document.getElementById('scene');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x070914, 0.010);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
host.appendChild(renderer.domElement);
const labels = new CSS2DRenderer();
labels.setSize(innerWidth, innerHeight);
Object.assign(labels.domElement.style, { position: 'absolute', top: 0, pointerEvents: 'none' });
host.appendChild(labels.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const pl = new THREE.PointLight(0xffffff, 300); pl.position.set(0, 40, 30); scene.add(pl);

// stars live on a far shell so none ever sits next to the camera
const starPos = new Float32Array(1500 * 3);
for (let i = 0; i < starPos.length; i += 3) {
  const v = new THREE.Vector3().randomDirection().multiplyScalar(150 + Math.random() * 100);
  starPos.set([v.x, v.y, v.z], i);
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x8090ff, size: 0.6, transparent: true, opacity: 0.6 })));

// ---------- views: overview (top-level nodes) or one subsystem (its parts + other top-level nodes as ghosts) ----------
const world = new THREE.Group(); scene.add(world);
const LAYER_GAP = 10;
let view = null;          // null = overview, else subsystem id
const shown = new Map();  // id -> { mesh, glow, el, ghost }
let linkObjs = [], labelEls = [];

function addLabel(text, cls, parent, pos) {
  const el = document.createElement('div'); el.className = cls; el.textContent = text;
  const o = new CSS2DObject(el); o.position.copy(pos); parent.add(o); labelEls.push(el);
  return el;
}

function addNode(n, pos, ghost) {
  const color = groups.get(gid(n))?.color ?? 0x9aa3c7;
  const kids = children(n.id).length;
  const size = n.kind === 'subsystem' ? 1.3 + Math.min(1.2, kids * 0.12) : 0.8 + Math.min(1, (n.weight || 1) * 0.2);
  const geo = n.kind === 'external' ? new THREE.OctahedronGeometry(size * 1.15) : new THREE.SphereGeometry(size, 32, 32);
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.7, roughness: 0.3, transparent: true, flatShading: n.kind === 'external', wireframe: n.status === 'planned' }));
  mesh.position.copy(pos);
  const glow = new THREE.Mesh(new THREE.SphereGeometry(size * 1.9, 24, 24),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.12, blending: THREE.AdditiveBlending, depthWrite: false }));
  mesh.add(glow);
  mesh.userData = n;
  world.add(mesh);
  const el = addLabel((kids ? '◉ ' : '') + (n.label || n.id), 'label' + (ghost ? ' ghost' : ''), mesh, new THREE.Vector3(0, size + 1, 0));
  shown.set(n.id, { mesh, glow, el, ghost });
}

// Which visible node stands for `id` in the current view (itself, or its subsystem), or null.
function vid(id) {
  if (shown.has(id)) return id;
  const t = topOf(id);
  return shown.has(t) ? t : null;
}

function build(v) {
  labelEls.forEach((e) => e.remove()); labelEls = [];
  world.clear(); shown.clear(); linkObjs = [];
  view = v;
  const inner = v ? children(v) : D.nodes.filter((n) => !n.parent);
  const used = [...groups.keys()].filter((g) => inner.some((n) => gid(n) === g));
  let maxR = 6;
  used.forEach((g, li) => {
    const ns = inner.filter((n) => gid(n) === g);
    const y = ((used.length - 1) / 2 - li) * LAYER_GAP;
    const r = Math.max(6, ns.length * 2.4);
    maxR = Math.max(maxR, r);
    const color = groups.get(g).color;
    const ring = new THREE.Mesh(new THREE.RingGeometry(r - 0.15, r + 0.15, 96),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.25, side: THREE.DoubleSide }));
    ring.rotation.x = -Math.PI / 2; ring.position.y = y; world.add(ring);
    addLabel(groups.get(g).name, 'layerTitle', world, new THREE.Vector3(r + 3, y, 0)).style.color = hex(color);
    ns.forEach((n, i) => {
      const a = (i / ns.length) * Math.PI * 2 + li * 0.6;
      addNode(n, new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r), false);
    });
  });
  if (v) {
    const others = D.nodes.filter((n) => !n.parent && n.id !== v);
    const R = maxR + 16;
    others.forEach((n, i) => {
      const a = (i / others.length) * Math.PI * 2;
      addNode(n, new THREE.Vector3(Math.cos(a) * R, 0, Math.sin(a) * R), true);
    });
  }
  // Links are drawn between whatever represents each end in this view; duplicates merge.
  const agg = new Map();
  for (const l of links) {
    const a = vid(l.from), b = vid(l.to);
    if (!a || !b || a === b) continue;
    if (v && byId.get(a)?.parent !== v && byId.get(b)?.parent !== v) continue;
    const k = a + '>' + b;
    const e = agg.get(k) || { from: a, to: b, async: false, inferred: true };
    e.async ||= !!l.async;
    e.inferred &&= l.confidence === 'inferred';
    agg.set(k, e);
  }
  for (const e of agg.values()) {
    const pa = shown.get(e.from).mesh.position, pb = shown.get(e.to).mesh.position;
    const mid = pa.clone().lerp(pb, 0.5); mid.y += 2;
    const geo = new THREE.BufferGeometry().setFromPoints(new THREE.QuadraticBezierCurve3(pa, mid, pb).getPoints(32));
    const color = e.async ? ASYNC : e.inferred ? 0xffd84d : shown.get(e.from).mesh.material.color;
    const mat = e.inferred
      ? new THREE.LineDashedMaterial({ color, dashSize: 0.6, gapSize: 0.45, transparent: true, opacity: 0.35 })
      : new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.35 });
    const line = new THREE.Line(geo, mat);
    if (e.inferred) line.computeLineDistances();
    line.userData = e; world.add(line); linkObjs.push(line);
  }
  document.getElementById('crumbs').innerHTML = v
    ? `<button class="linkbtn" data-up>System overview</button> › <b>${nameOf(v)}</b><div class="hint">inside ${nameOf(v)} · faded nodes are the rest of the system</div>`
    : `<b>System overview</b><div class="hint">drag = rotate · scroll = zoom · click = explain · double-click ◉ = go inside</div>`;
  highlight(null);
  if (flow) setStep(step);
}

// ---------- camera ----------
let fly = null;
function frame(instant) {
  const box = new THREE.Box3();
  for (const v of shown.values()) box.expandByObject(v.mesh);
  const c = box.getCenter(new THREE.Vector3());
  const dist = Math.max(30, box.getSize(new THREE.Vector3()).length() * 1.05);
  const p = new THREE.Vector3(c.x + dist * 0.6, c.y + dist * 0.45, c.z + dist * 0.75);
  if (instant) { camera.position.copy(p); controls.target.copy(c); }
  else fly = { p0: camera.position.clone(), t0: controls.target.clone(), p1: p, t1: c, start: performance.now() };
}
function enter(v) { build(v); frame(); controls.autoRotate = false; }

// dim everything except the given visible ids (null = show all)
function highlight(ids) {
  for (const [id, v] of shown) {
    const on = !ids || ids.has(id);
    const base = v.ghost ? 0.25 : 0.7;
    v.mesh.material.emissiveIntensity = on ? (ids ? 1.4 : base) : 0.08;
    v.mesh.material.opacity = on ? (v.ghost && !ids ? 0.5 : 1) : 0.25;
    v.glow.material.opacity = on ? (ids ? 0.25 : 0.12) : 0.02;
    v.el.classList.toggle('dim', !on);
  }
  for (const line of linkObjs) {
    const on = !ids || (ids.has(line.userData.from) && ids.has(line.userData.to));
    line.material.opacity = on ? (ids ? 0.9 : 0.35) : 0.05;
  }
}

// ---------- details panel ----------
const details = document.getElementById('details');
const section = (title, body) => body ? `<h3>${title}</h3>${body}` : '';
const list = (items, fn = esc) => items?.length ? `<ul>${items.map(fn).join('')}</ul>` : '';
const li = (x) => `<li>${x}</li>`;
const evidence = (ev) => list(ev, (e) => `<li class="ev">${esc(e)}</li>`);
const inferredNote = (o) => o.confidence === 'inferred' && o.reason ? `<p class="why-inferred"><b>Why this is inferred:</b> ${esc(o.reason)}</p>` : '';

function openPanel(html) {
  details.innerHTML = `<button class="close" aria-label="Close">×</button>${html}`;
  details.style.display = 'block';
  details.scrollTop = 0;
}

function linkItem(l, other, via) {
  return li(`<button class="linkbtn" data-node="${esc(l[other])}">${nameOf(l[other])}</button>${via}
    <span class="kind">${esc(l.kind || '')}${l.async ? ' · async' : ''}</span>${l.label ? ' — ' + esc(l.label) : ''}
    ${l.confidence === 'inferred' ? badge('inferred') + (l.reason ? `<span class="kind">${esc(l.reason)}</span>` : '') : ''}
    ${l.evidence?.length ? `<div class="ev">${l.evidence.map(esc).join(' · ')}</div>` : ''}`);
}

function showNode(n) {
  const kids = children(n.id);
  const fam = new Set([n.id, ...kids.map((k) => k.id)]);
  const out = links.filter((l) => fam.has(l.from) && !fam.has(l.to));
  const inc = links.filter((l) => fam.has(l.to) && !fam.has(l.from));
  const via = (l, end) => l[end] !== n.id ? `<span class="kind"> (via ${nameOf(l[end])})</span>` : '';
  const inFlows = flows.map((f, i) => [f, i]).filter(([f]) => f.steps.some((s) => fam.has(s.from) || fam.has(s.to)));
  const d = n.data || {};
  const dataHtml = ['owns', 'receives', 'produces'].filter((k) => d[k]?.length)
    .map((k) => li(`<b>${k[0].toUpperCase() + k.slice(1)}:</b> ${d[k].map(esc).join('; ')}`)).join('');
  const g = groups.get(gid(n));
  openPanel(`
    <h2>${esc(n.label || n.id)} ${badge(n.confidence || 'verified')}${n.status && n.status !== 'implemented' ? badge(n.status) : ''}</h2>
    <div class="path">${esc(n.kind)}${g ? ' · ' + esc(g.name) : ''}${n.parent ? ' · inside ' + nameOf(n.parent) : ''}${n.path ? ' · ' + esc(n.path) : ''}</div>
    <p>${esc(n.what)}</p>
    ${n.analogy ? `<p class="analogy">${esc(n.analogy)}</p>` : ''}
    ${inferredNote(n)}
    ${section('Why it exists', n.why ? `<p>${esc(n.why)}</p>` : '')}
    ${section('Responsibilities', list(n.responsibilities))}
    ${section('Data', dataHtml ? `<ul>${dataHtml}</ul>` : '')}
    ${section(`Inside (${kids.length})`, kids.length ? list(kids, (k) => li(`<button class="linkbtn" data-node="${esc(k.id)}">${esc(k.label || k.id)}</button> — <span class="kind">${esc(k.what)}</span>`))
      + (view !== n.id ? `<button data-explore="${esc(n.id)}">Explore inside →</button>` : '') : '')}
    ${section('Depends on / talks to', list(out, (l) => linkItem(l, 'to', via(l, 'from'))))}
    ${section('Used by', list(inc, (l) => linkItem(l, 'from', via(l, 'to'))))}
    ${section('Part of these workflows', list(inFlows, ([f, i]) => li(`<button class="linkbtn" data-flow="${i}">▶ ${esc(f.name)}</button>`)))}
    ${section('Evidence', evidence(n.evidence))}`);
}

function showAbout() {
  openPanel(`
    <h2>About this system</h2>
    ${A.style ? `<div class="path">${esc(A.style)}</div>` : ''}
    <p>${esc(A.summary || D.summary || '')}</p>
    ${section('What gets deployed / run', list(A.deployables, (d) => li(`<b>${esc(d.name)}</b> — ${esc(d.what)}${d.evidence?.length ? `<div class="ev">${d.evidence.map(esc).join(' · ')}</div>` : ''}`)))}
    ${section('Parts of the system', list(D.nodes.filter((n) => !n.parent), (n) => li(`<button class="linkbtn" data-node="${esc(n.id)}">${esc(n.label || n.id)}</button> <span class="kind">${esc(n.kind)}</span> — ${esc(n.what)}`)))}
    ${section('Groups', list([...groups.values()], (g) => li(`<b style="color:${hex(g.color)}">${esc(g.name)}</b>${g.what ? ' — ' + esc(g.what) : ''}`)))}
    ${section('Workflows', list(flows.map((f, i) => [f, i]), ([f, i]) => li(`<button class="linkbtn" data-flow="${i}">▶ ${esc(f.name)}</button>${f.description ? ' — ' + esc(f.description) : ''}`)))}
    ${section("Couldn't determine from the code", A.unknowns?.length ? list(A.unknowns) : '<p class="kind">Nothing flagged.</p>')}
    <h3>How to read this</h3>
    <p class="kind">Every claim cites the file and line it came from. ${badge('verified')} means the cited code shows it directly. ${badge('inferred')} means it's a reasoned guess (the reason is shown). ${badge('optional')} parts only run when a setting turns them on. ${badge('planned')} parts (wireframes) are mentioned or stubbed but not built yet. Anything that couldn't be worked out is listed above instead of being drawn.</p>`);
}

function selectNode(id) {
  const n = byId.get(id); if (!n) return;
  if (!shown.has(id)) enter(n.parent || null);
  showNode(n);
  const fam = new Set([id, ...children(id).map((k) => k.id)]);
  const ids = new Set([vid(id)]);
  for (const l of links) if (fam.has(l.from) || fam.has(l.to)) { ids.add(vid(l.from)); ids.add(vid(l.to)); }
  ids.delete(null);
  highlight(ids);
}

details.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.classList.contains('close')) { details.style.display = 'none'; highlight(null); }
  else if (b.dataset.node) selectNode(b.dataset.node);
  else if (b.dataset.explore) { enter(b.dataset.explore); showNode(byId.get(b.dataset.explore)); }
  else if (b.dataset.flow) { sel.value = b.dataset.flow; sel.onchange(); play(); }
});
document.getElementById('crumbs').addEventListener('click', (e) => { if (e.target.closest('[data-up]')) { enter(null); showAbout(); } });
document.getElementById('aboutBtn').onclick = showAbout;
document.getElementById('reset').onclick = () => { stopFlow(); highlight(null); frame(); controls.autoRotate = true; };

// ---------- picking ----------
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
function pick(e) {
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  return ray.intersectObjects([...shown.values()].map((v) => v.mesh), false)[0]?.object;
}
let downAt = null;
renderer.domElement.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; controls.autoRotate = false; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return; // was a drag
  const hit = pick(e);
  if (hit) selectNode(hit.userData.id);
});
renderer.domElement.addEventListener('dblclick', (e) => {
  const n = pick(e)?.userData;
  if (n && children(n.id).length && view !== n.id) { enter(n.id); showNode(n); }
});
renderer.domElement.addEventListener('pointermove', (e) => { renderer.domElement.style.cursor = pick(e) ? 'pointer' : 'grab'; });

// ---------- workflows ----------
const sel = document.getElementById('flowSel');
sel.innerHTML = flows.map((f, i) => `<option value="${i}">${esc(f.name)}</option>`).join('') || '<option>No workflows detected</option>';
const caption = document.getElementById('caption');
const particleMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const particle = new THREE.Mesh(new THREE.SphereGeometry(0.55, 16, 16), particleMat);
const particleLight = new THREE.PointLight(0xffffff, 40, 12);
particle.add(particleLight);
particle.visible = false; scene.add(particle);
const trail = [];

let flow = null, step = -1, stepStart = 0, playing = false;
const STEP_MS = 3200;
const playBtn = document.getElementById('play');

function describeFlow() {
  const f = flows[+sel.value];
  caption.innerHTML = f
    ? `<span class="step">${esc(f.name)}${f.trigger ? ' · starts when: ' + esc(f.trigger) : ''}</span>${esc(f.description || '')}<div class="kind" style="margin-top:4px">Press Play to watch it travel through the system.</div>`
    : 'No workflows were detected.';
}

function setStep(i) {
  const f = flows[+sel.value]; if (!f) return;
  flow = f; step = Math.max(0, Math.min(i, f.steps.length - 1)); stepStart = performance.now();
  const s = f.steps[step];
  const k = s.kind || 'request';
  caption.innerHTML = `<span class="step">${badge(k)}Step ${step + 1} / ${f.steps.length} · ${nameOf(s.from)} → ${nameOf(s.to)}</span>
    ${esc(s.text)}
    ${s.data ? `<div class="carries"><b>Carries:</b> ${esc(s.data)}</div>` : ''}
    ${s.confidence === 'inferred' ? `<div class="carries">${badge('inferred')}${esc(s.reason || '')}</div>` : ''}
    ${s.evidence?.length ? `<div class="ev">${s.evidence.map(esc).join(' · ')}</div>` : ''}`;
  const ids = new Set(f.steps.slice(0, step + 1).flatMap((x) => [vid(x.from), vid(x.to)]));
  ids.delete(null);
  highlight(ids);
  particleMat.color.setHex(STEP_COLOR[k] ?? 0xffffff);
  particleLight.color.setHex(STEP_COLOR[k] ?? 0xffffff);
  particle.visible = true;
}
function stopFlow() { playing = false; flow = null; playBtn.textContent = '▶ Play'; particle.visible = false; trail.forEach((t) => scene.remove(t)); trail.length = 0; }
function play() { controls.autoRotate = false; playing = true; playBtn.textContent = '■ Stop'; setStep(0); }
playBtn.onclick = () => playing ? stopFlow() : play();
const pause = () => { playing = false; playBtn.textContent = '▶ Play'; };
document.getElementById('next').onclick = () => { pause(); setStep(flow ? step + 1 : 0); };
document.getElementById('prev').onclick = () => { pause(); setStep(flow ? step - 1 : 0); };
sel.onchange = () => { stopFlow(); highlight(null); describeFlow(); };
describeFlow();

function updateParticle(now) {
  if (!flow || !particle.visible) return;
  const s = flow.steps[step], a = shown.get(vid(s.from)), b = shown.get(vid(s.to));
  if (a && b) {
    const t = Math.min(1, (now - stepStart) / (STEP_MS * 0.6));
    const e = t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
    if (a === b) { // work inside one place: orbit it
      const ang = e * Math.PI * 4;
      particle.position.copy(a.mesh.position).add(new THREE.Vector3(Math.cos(ang) * 2.2, Math.sin(e * Math.PI) * 1.5, Math.sin(ang) * 2.2));
    } else {
      const mid = a.mesh.position.clone().lerp(b.mesh.position, 0.5); mid.y += 2;
      new THREE.QuadraticBezierCurve3(a.mesh.position, mid, b.mesh.position).getPoint(e, particle.position);
    }
    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 8), new THREE.MeshBasicMaterial({ color: particleMat.color.clone(), transparent: true, opacity: 0.8 }));
    dot.position.copy(particle.position); scene.add(dot); trail.push(dot);
    while (trail.length > 40) scene.remove(trail.shift());
    trail.forEach((d, i) => (d.material.opacity = (i / trail.length) * 0.7));
  }
  if (playing && now - stepStart > STEP_MS) {
    if (step < flow.steps.length - 1) setStep(step + 1);
    else { playing = false; playBtn.textContent = '▶ Replay'; }
  }
}

// ---------- start + loop ----------
build(null);
frame(true);
showAbout();
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labels.setSize(innerWidth, innerHeight);
});
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reduceMotion) controls.autoRotate = false;
renderer.setAnimationLoop((now) => {
  if (fly) {
    const t = Math.min(1, (now - fly.start) / (reduceMotion ? 1 : 900));
    const e = 1 - (1 - t) ** 3;
    camera.position.lerpVectors(fly.p0, fly.p1, e);
    controls.target.lerpVectors(fly.t0, fly.t1, e);
    if (t === 1) fly = null;
  }
  const pulse = reduceMotion ? 1 : 1 + Math.sin(now / 400) * 0.08;
  for (const v of shown.values()) v.glow.scale.setScalar(pulse);
  updateParticle(now);
  controls.update();
  renderer.render(scene, camera);
  labels.render(scene, camera);
});
</script>
<script>
  // If the CDN module never loads, show a friendly message instead of a black screen.
  setTimeout(() => { if (!document.querySelector('#scene canvas')) document.getElementById('err').style.display = 'grid'; }, 6000);
</script>
</body>
</html>
